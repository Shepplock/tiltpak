<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1d2a22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tilt Pak</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Tilt Pak","short_name":"Tilt Pak","start_url":".","display":"standalone","orientation":"any","background_color":"%231d2a22","theme_color":"%231d2a22","icons":[{"src":"data:image/svg%2Bxml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 512 512%27%3E%3Crect width=%27512%27 height=%27512%27 fill=%27%231d2a22%27/%3E%3Crect x=%2764%27 y=%27196%27 width=%27384%27 height=%27120%27 fill=%27%23e8825b%27/%3E%3C/svg%3E","sizes":"512x512","type":"image/svg+xml","purpose":"any"}]}'>
<style>
:root{
  --mat:#1d2a22; --mat-line:#2b3b31;
  --panel:#c9c6ba; --panel-dark:#a8a599; --ink:#1a1c18; --ink-soft:#5a5f54;
  --paper:#e9e6da; --accent:#e8825b; --accent-ink:#2a1109; --rec:#d94f3d;
}
body[data-skin="sprue"]{ --mat:#8f9086; --mat-line:#9a9b91; --panel:#d6d3c8; --panel-dark:#b8b5aa; --paper:#efece1; --accent:#3f6d8f; }
body[data-skin="nuit"]{ --mat:#101210; --mat-line:#1b1e1b; --panel:#26282a; --panel-dark:#1b1d1f; --ink:#e6e4da; --ink-soft:#8e928c; --paper:#2f3134; --accent:#d9b64a; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:var(--mat); color:var(--ink);
  font-family:"Futura","Jost","Avenir Next","Century Gothic",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  touch-action:manipulation;
}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

/* ---------- top ---------- */
header{display:flex;align-items:center;gap:14px;padding:10px 14px 8px;flex:0 0 auto}
.brand{font-size:17px;letter-spacing:.14em;color:var(--paper);opacity:.9}
.brand b{font-weight:600;color:var(--accent)}
.modes{margin-left:auto;display:flex;background:rgba(0,0,0,.22);border-radius:999px;padding:3px}
.modes button{padding:6px 13px;border-radius:999px;font-size:13.5px;color:var(--paper);opacity:.55}
.modes button[aria-pressed="true"]{background:var(--panel);color:var(--ink);opacity:1}

/* ---------- stage (cutting mat) ---------- */
#stage{
  flex:1 1 auto; position:relative; display:flex; align-items:center; justify-content:center;
  min-height:0; margin:0 10px; border-radius:6px; overflow:hidden;
  background-color:var(--mat);
  background-image:
    linear-gradient(var(--mat-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);
  background-size:26px 26px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
}
#frame{position:absolute;line-height:0;box-shadow:0 6px 22px rgba(0,0,0,.45);background:#000;touch-action:none}
canvas{display:block;width:100%;height:100%;border-radius:2px}
#guide{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
#guide.on{opacity:1}
#guide svg{width:100%;height:100%;display:block;overflow:visible}
#osd{position:absolute;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:8px;
  color:#fff;font-size:12.5px;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none}
#osd .dot{width:9px;height:9px;border-radius:50%;background:var(--rec)}
#osd[hidden]{display:none}
@keyframes blink{50%{opacity:.15}}
#osd .dot{animation:blink 1.1s steps(1,end) infinite}
@media (prefers-reduced-motion:reduce){#osd .dot{animation:none}}
#empty{position:absolute;color:var(--paper);opacity:.6;font-size:14px;text-align:center;padding:0 30px;line-height:1.5}

/* ---------- ruler ---------- */
#ruler{flex:0 0 auto;padding:12px 16px 2px}
.ruler-head{display:flex;align-items:baseline;gap:10px;color:var(--paper);font-size:12.5px;opacity:.75}
.ruler-head strong{margin-left:auto;font-size:19px;font-weight:500;opacity:1;color:var(--accent)}
input[type=range].rule{
  -webkit-appearance:none;appearance:none;width:100%;height:34px;background:none;margin:2px 0 0;display:block
}
input[type=range].rule::-webkit-slider-runnable-track{height:34px;border-radius:3px;
  background:
    repeating-linear-gradient(90deg,var(--paper) 0 1px,transparent 1px 20px) bottom/100% 9px no-repeat,
    repeating-linear-gradient(90deg,var(--paper) 0 1px,transparent 1px 100px) bottom/100% 17px no-repeat,
    var(--panel-dark);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
input[type=range].rule::-moz-range-track{height:34px;border-radius:3px;background:var(--panel-dark)}
input[type=range].rule::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:40px;margin-top:-3px;
  border-radius:2px;background:var(--accent);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
input[type=range].rule::-moz-range-thumb{width:14px;height:40px;border:0;border-radius:2px;background:var(--accent)}
.ticks{display:flex;justify-content:space-between;color:var(--paper);opacity:.45;font-size:10.5px;padding-top:3px}

/* ---------- bottom ---------- */
footer{flex:0 0 auto;padding:8px 16px 14px;display:flex;align-items:center;gap:12px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--paper);
  background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.chip[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:none}
.round{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.22);color:var(--paper);
  display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font-size:12px;line-height:1.1;text-align:center}
.round svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#shutter{margin:0 auto;width:74px;height:74px;border-radius:50%;background:var(--paper);
  box-shadow:0 0 0 3px var(--mat),0 0 0 5px var(--paper);display:grid;place-items:center;position:relative}
#shutter i{display:block;width:26px;height:26px;border-radius:50%;background:var(--rec);transition:border-radius .18s,width .18s,height .18s}
body.recording #shutter i{border-radius:4px;width:22px;height:22px}
#shutter[data-kind="save"] i{background:var(--accent);border-radius:4px}
#shutter:disabled{opacity:.45}
#prog{position:absolute;inset:-3px;border-radius:50%;display:none}
body.busy #prog{display:block}

/* ---------- sheet ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);color:var(--ink);
  border-radius:16px 16px 0 0;transform:translateY(101%);transition:transform .28s cubic-bezier(.3,.8,.3,1);
  max-height:78vh;overflow:auto;padding:6px 18px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.4)}
#sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
.grab{width:44px;height:4px;border-radius:2px;background:var(--ink);opacity:.25;margin:8px auto 12px}
.row{display:flex;align-items:center;gap:12px;padding:7px 0}
.row label{flex:0 0 96px;font-size:13.5px;color:var(--ink-soft)}
.row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:22px;background:none}
.row input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink);opacity:.35}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;border-radius:50%;background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.row input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
.row input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--accent)}
.row output{flex:0 0 48px;text-align:right;font-size:13px;color:var(--ink-soft)}
.seg{display:flex;gap:6px;flex:1}
.seg button{flex:1;padding:8px;border-radius:8px;font-size:13px;background:rgba(0,0,0,.07);color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
hr{border:0;border-top:1px solid rgba(0,0,0,.12);margin:12px 0}
.hint{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:2px 0 0}

/* ---------- result ---------- */
#result{position:fixed;inset:0;z-index:30;background:rgba(10,12,10,.94);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:22px}
#result.open{display:flex}
#result video,#result img{max-width:100%;max-height:56vh;border-radius:4px;background:#000}
#result .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#result .acts button{padding:12px 20px;border-radius:10px;background:var(--paper);color:var(--ink);font-size:14.5px}
#result .acts button.ghost{background:none;color:var(--paper);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:8px;font-size:13px;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:82vw;text-align:center}
#toast.on{opacity:.96}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body data-skin="tapis">

<header>
  <div class="brand">tilt&nbsp;<b>pak</b></div>
  <div class="modes" role="group">
    <button data-mode="cam" aria-pressed="true">Caméra</button>
    <button data-mode="vid" aria-pressed="false">Vidéo</button>
    <button data-mode="img" aria-pressed="false">Photo</button>
  </div>
</header>

<div id="stage">
  <div id="empty">Touchez le déclencheur pour autoriser la caméra.</div>
  <div id="frame" hidden>
    <canvas id="gl"></canvas>
    <div id="guide"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><g id="gg"></g></svg></div>
    <div id="osd" hidden><span class="dot"></span><span id="tc">0:00</span><span id="sub" style="margin-left:auto"></span></div>
  </div>
</div>

<div id="ruler">
  <div class="ruler-head"><span>Échelle apparente</span><strong id="scaleOut">1:87</strong></div>
  <input type="range" class="rule" id="scale" min="0" max="1000" value="620" aria-label="Échelle apparente">
  <div class="ticks"><span>1:12</span><span>1:35</span><span>1:72</span><span>1:160</span><span>1:220</span></div>
</div>

<div class="chips" id="presets">
  <button class="chip" data-preset="diorama" aria-pressed="true">Diorama</button>
  <button class="chip" data-preset="vitrine" aria-pressed="false">Vitrine</button>
  <button class="chip" data-preset="doux" aria-pressed="false">Doux</button>
  <button class="chip" data-preset="jouet" aria-pressed="false">Jouet</button>
  <button class="chip" data-preset="reel" aria-pressed="false">Neutre</button>
</div>

<footer>
  <button class="round" id="left" aria-label="Changer de caméra">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2M21 12a9 9 0 0 1-15.5 6.2"/><path d="M18 3v3.5h-3.5M6 21v-3.5h3.5"/></svg>
  </button>
  <button id="shutter" aria-label="Enregistrer">
    <svg id="prog" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="none" stroke="#e8825b" stroke-width="4"
      stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"
      transform="rotate(-90 50 50)"/></svg>
    <i></i>
  </button>
  <button class="round" id="right" aria-label="Réglages">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="2.2" fill="currentColor" stroke="none"/><circle cx="8" cy="17" r="2.2" fill="currentColor" stroke="none"/></svg>
  </button>
</footer>

<div id="sheet">
  <div class="grab"></div>
  <div class="row"><label>Zone nette</label>
    <div class="seg" id="shape"><button data-v="0" aria-pressed="true">Bande</button><button data-v="1" aria-pressed="false">Ovale</button></div></div>
  <div class="row"><label for="angle">Inclinaison</label><input type="range" id="angle" min="-90" max="90" value="0"><output id="o-angle">0°</output></div>
  <div class="row"><label for="feather">Dégradé</label><input type="range" id="feather" min="1" max="60" value="18"><output id="o-feather">18</output></div>
  <div class="row"><label for="blur">Flou</label><input type="range" id="blur" min="0" max="40" value="16"><output id="o-blur">16</output></div>
  <hr>
  <div class="row"><label for="sat">Saturation</label><input type="range" id="sat" min="0" max="250" value="145"><output id="o-sat">1.45</output></div>
  <div class="row"><label for="con">Contraste</label><input type="range" id="con" min="50" max="200" value="115"><output id="o-con">1.15</output></div>
  <div class="row"><label for="exp">Exposition</label><input type="range" id="exp" min="-100" max="100" value="4"><output id="o-exp">+0.04</output></div>
  <div class="row"><label for="warm">Chaleur</label><input type="range" id="warm" min="-100" max="100" value="15"><output id="o-warm">+0.15</output></div>
  <div class="row"><label for="vig">Vignette</label><input type="range" id="vig" min="0" max="100" value="25"><output id="o-vig">0.25</output></div>
  <hr>
  <div class="row"><label>Accéléré</label>
    <div class="seg" id="speed"><button data-v="1" aria-pressed="true">1×</button><button data-v="2">2×</button><button data-v="4">4×</button><button data-v="8">8×</button><button data-v="16">16×</button></div></div>
  <div class="row"><label>Définition</label>
    <div class="seg" id="qual"><button data-v="720">720p</button><button data-v="1080" aria-pressed="true">1080p</button><button data-v="1440">1440p</button></div></div>
  <div class="row"><label>Son</label>
    <div class="seg" id="audio"><button data-v="0" aria-pressed="true">Coupé</button><button data-v="1">Micro</button></div></div>
  <div class="row"><label>Habillage</label>
    <div class="seg" id="skin"><button data-v="tapis" aria-pressed="true">Tapis</button><button data-v="sprue">Sprue</button><button data-v="nuit">Nuit</button></div></div>
  <p class="hint">Sur l'aperçu&nbsp;: un doigt déplace la zone nette, deux doigts règlent sa largeur et son inclinaison. L'accéléré ne s'applique qu'aux vidéos importées.</p>
</div>

<div id="result">
  <div id="rHolder"></div>
  <div class="acts">
    <button id="rShare">Partager</button>
    <button id="rSave">Enregistrer le fichier</button>
    <button id="rClose" class="ghost">Fermer</button>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="pick" accept="video/*" hidden>
<input type="file" id="pickImg" accept="image/*" hidden>
<video id="cam" playsinline muted hidden></video>
<video id="src" playsinline hidden></video>

<script>
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v<a?a:v>b?b:v;

/* ======================= état ======================= */
const P = {
  shape:0, cx:.5, cy:.5, width:.20, feather:.18, angle:0, ry:1.6,
  blur:16, sat:1.45, con:1.15, exp:.04, warm:.15, vig:.25,
  speed:1, qual:1080, audio:0, mirror:true
};
let mode='cam', facing='environment', camStream=null, busy=false, compare=false;

const PRESETS = {
  diorama:{shape:0,width:.20,feather:.18,blur:18,sat:1.45,con:1.15,exp:.04,warm:.15,vig:.25},
  vitrine:{shape:1,width:.26,feather:.22,blur:22,sat:1.35,con:1.10,exp:.02,warm:.05,vig:.35},
  doux   :{shape:0,width:.32,feather:.30,blur:9 ,sat:1.12,con:1.04,exp:.02,warm:.08,vig:.12},
  jouet  :{shape:0,width:.16,feather:.14,blur:26,sat:1.9 ,con:1.30,exp:.06,warm:.25,vig:.30},
  reel   :{shape:0,width:.24,feather:.20,blur:14,sat:1.00,con:1.00,exp:0  ,warm:0  ,vig:0  }
};

/* ======================= WebGL ======================= */
const canvas = $('#gl');
const gl = canvas.getContext('webgl2',{alpha:false,antialias:false,desynchronized:true,preserveDrawingBuffer:false});
if(!gl){ document.body.innerHTML = '<p style="color:#eee;padding:40px;font:16px system-ui">WebGL2 indisponible sur ce navigateur.</p>'; }

const VS = `#version 300 es
in vec2 a; out vec2 v;
void main(){ v = a*.5+.5; gl_Position = vec4(a,0.,1.); }`;

const MASK = `
uniform vec2 uC; uniform float uW,uF,uA,uShape,uAsp,uRy;
float maskAt(vec2 uv){
  vec2 p = uv - uC;
  p.x *= uAsp;
  float s = sin(uA), c = cos(uA);
  p = vec2(p.x*c - p.y*s, p.x*s + p.y*c);
  float d = uShape < .5 ? abs(p.y) : length(p / vec2(uRy,1.0));
  return smoothstep(uW*.5, uW*.5 + max(uF,.002), d);
}`;

const FS_COPY = `#version 300 es
precision highp float; in vec2 v; out vec4 o;
uniform sampler2D uT; uniform float uFlip;
void main(){ vec2 uv=v; uv.x = mix(uv.x, 1.0-uv.x, uFlip); o = vec4(texture(uT,uv).rgb,1.0); }`;

const FS_BLUR = `#version 300 es
precision highp float; in vec2 v; out vec4 o;
uniform sampler2D uT; uniform vec2 uDir; uniform float uR;
${MASK}
void main(){
  float r = uR * maskAt(v);
  if(r < .4){ o = texture(uT,v); return; }
  vec2 st = uDir * (r/6.0);
  float w0=.18198, w1=.16426, w2=.12026, w3=.07163, w4=.03471, w5=.01374, w6=.00442;
  vec3 s = texture(uT,v).rgb * w0;
  s += (texture(uT,v+st).rgb     + texture(uT,v-st).rgb)     * w1;
  s += (texture(uT,v+st*2.).rgb  + texture(uT,v-st*2.).rgb)  * w2;
  s += (texture(uT,v+st*3.).rgb  + texture(uT,v-st*3.).rgb)  * w3;
  s += (texture(uT,v+st*4.).rgb  + texture(uT,v-st*4.).rgb)  * w4;
  s += (texture(uT,v+st*5.).rgb  + texture(uT,v-st*5.).rgb)  * w5;
  s += (texture(uT,v+st*6.).rgb  + texture(uT,v-st*6.).rgb)  * w6;
  o = vec4(s,1.0);
}`;

const FS_FINAL = `#version 300 es
precision highp float; in vec2 v; out vec4 o;
uniform sampler2D uSrc, uBlur;
uniform float uSat,uCon,uExp,uWarm,uVig,uBypass;
${MASK}
void main(){
  vec3 a = texture(uSrc,v).rgb;
  if(uBypass > .5){ o = vec4(a,1.0); return; }
  float m = maskAt(v);
  vec3 b = texture(uBlur,v).rgb;
  vec3 c = mix(a, b, smoothstep(0.0,0.22,m));
  c *= exp2(uExp);
  float l = dot(c, vec3(.2126,.7152,.0722));
  c = mix(vec3(l), c, uSat);
  c = (c-.5)*uCon + .5;
  c.r *= 1.0 + uWarm*.09;
  c.b *= 1.0 - uWarm*.09;
  vec2 q = (v-.5)*vec2(uAsp,1.0);
  c *= 1.0 - uVig*smoothstep(.32,.92,length(q));
  o = vec4(clamp(c,0.0,1.0),1.0);
}`;

function sh(type,src){
  const s = gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s),src);
  return s;
}
function prog(fs){
  const p = gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(p,0,'a');
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const nm = gl.getActiveUniform(p,i).name; u[nm] = gl.getUniformLocation(p,nm); }
  return {p,u};
}

let pCopy,pBlur,pFinal,vao,texSrc,fboSrc,fboA,fboB;
if(gl){
  pCopy = prog(FS_COPY); pBlur = prog(FS_BLUR); pFinal = prog(FS_FINAL);
  vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  texSrc = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,texSrc);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
}

function makeFBO(w,h){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {t,f,w,h};
}
function delFBO(o){ if(o){ gl.deleteTexture(o.t); gl.deleteFramebuffer(o.f); } }

function setSize(w,h){
  const max = mode==='img' ? 2560 : P.qual;
  const k = Math.min(1, max/Math.max(w,h));
  w = Math.max(2, Math.round(w*k/2)*2); h = Math.max(2, Math.round(h*k/2)*2);
  if(canvas.width===w && canvas.height===h) return;
  canvas.width=w; canvas.height=h;
  delFBO(fboSrc); delFBO(fboA); delFBO(fboB);
  fboSrc = makeFBO(w,h);
  const hw = Math.max(2,w>>1), hh = Math.max(2,h>>1);
  fboA = makeFBO(hw,hh); fboB = makeFBO(hw,hh);
  layout();
}

function maskUniforms(u){
  gl.uniform2f(u.uC, P.cx, P.cy);
  gl.uniform1f(u.uW, P.width);
  gl.uniform1f(u.uF, P.feather);
  gl.uniform1f(u.uA, P.angle*Math.PI/180);
  gl.uniform1f(u.uShape, P.shape);
  gl.uniform1f(u.uRy, P.ry);
  gl.uniform1f(u.uAsp, canvas.width/canvas.height);
}
function pass(t, target){
  gl.bindFramebuffer(gl.FRAMEBUFFER, target?target.f:null);
  gl.viewport(0,0, target?target.w:canvas.width, target?target.h:canvas.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

function drawFrame(source){
  if(!gl || !fboSrc) return;
  gl.bindVertexArray(vao);

  if(source){
    gl.bindTexture(gl.TEXTURE_2D,texSrc);
    try{ gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,source); }catch(e){ return; }
  }

  // 1. source -> fboSrc (miroir éventuel)
  gl.useProgram(pCopy.p);
  gl.uniform1i(pCopy.u.uT,0);
  gl.uniform1f(pCopy.u.uFlip, (mode==='cam' && facing==='user' && P.mirror) ? 1 : 0);
  pass(texSrc, fboSrc);

  const bypass = compare || P.blur<0.5;
  if(!bypass){
    // 2. demi-résolution
    gl.uniform1f(pCopy.u.uFlip,0);
    pass(fboSrc.t, fboA);
    // 3. flou séparable, itéré
    const iter = clamp(Math.round(P.blur/8),1,3);
    const r = P.blur/Math.sqrt(iter);
    gl.useProgram(pBlur.p);
    gl.uniform1i(pBlur.u.uT,0);
    gl.uniform1f(pBlur.u.uR,r);
    maskUniforms(pBlur.u);
    for(let i=0;i<iter;i++){
      gl.uniform2f(pBlur.u.uDir, 1/fboA.w, 0); pass(fboA.t, fboB);
      gl.uniform2f(pBlur.u.uDir, 0, 1/fboA.h); pass(fboB.t, fboA);
    }
  }

  // 4. composition
  gl.useProgram(pFinal.p);
  maskUniforms(pFinal.u);
  gl.uniform1i(pFinal.u.uSrc,0);
  gl.uniform1i(pFinal.u.uBlur,1);
  gl.uniform1f(pFinal.u.uSat,P.sat); gl.uniform1f(pFinal.u.uCon,P.con);
  gl.uniform1f(pFinal.u.uExp,P.exp); gl.uniform1f(pFinal.u.uWarm,P.warm);
  gl.uniform1f(pFinal.u.uVig,P.vig); gl.uniform1f(pFinal.u.uBypass, bypass?1:0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, (bypass?fboSrc:fboA).t);
  pass(fboSrc.t, null);
}

const camEl = $('#cam'), srcEl = $('#src'), imgEl = new Image();

function loop(){
  requestAnimationFrame(loop);
  if(mode==='cam'){
    if(camEl.readyState>=2){ setSize(camEl.videoWidth,camEl.videoHeight); drawFrame(camEl); }
  } else if(mode==='vid'){
    if(srcEl.readyState>=2){ setSize(srcEl.videoWidth,srcEl.videoHeight); drawFrame(srcEl); }
  } else if(mode==='img' && hasImg){
    setSize(imgEl.naturalWidth,imgEl.naturalHeight);
    if(needStill){ drawFrame(imgEl); } else { drawFrame(null); }
    needStill = false;
  }
  if(snapshotCb){ const cb=snapshotCb; snapshotCb=null; cb(); }
  if(recording) tick();
}

function drawGuide(){
  const W = frame.clientWidth, H = frame.clientHeight;
  if(!W||!H) return;
  const svg = guide.querySelector('svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const cx = P.cx*W, cy = (1-P.cy)*H;
  const inner = P.width*.5*H, outer = (P.width*.5+P.feather)*H;
  const a = P.angle;
  const line = (off,dash) =>
    `<line x1="${-W*1.5}" y1="${off}" x2="${W*1.5}" y2="${off}" stroke="#fff" stroke-opacity=".85" stroke-width="1" ${dash?'stroke-dasharray="4 5" stroke-opacity=".45"':''}/>`;
  let g = `<g transform="translate(${cx} ${cy}) rotate(${a})">`;
  if(P.shape<.5){
    g += line(-inner)+line(inner)+line(-outer,1)+line(outer,1);
  }else{
    g += `<ellipse rx="${inner*P.ry}" ry="${inner}" fill="none" stroke="#fff" stroke-opacity=".85"/>`
       + `<ellipse rx="${outer*P.ry}" ry="${outer}" fill="none" stroke="#fff" stroke-opacity=".45" stroke-dasharray="4 5"/>`;
  }
  g += `<line x1="-9" y1="0" x2="9" y2="0" stroke="#fff" stroke-opacity=".9"/><line x1="0" y1="-9" x2="0" y2="9" stroke="#fff" stroke-opacity=".9"/></g>`;

}

/* ======================= gestes ======================= */
const pts = new Map();
let g0 = null;
frame.addEventListener('pointerdown', e=>{
  frame.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2) g0 = gesture();
  showGuide();
});
frame.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)) return;
  const p = pts.get(e.pointerId);
  const dx = e.clientX-p.x, dy = e.clientY-p.y;
  p.x = e.clientX; p.y = e.clientY;
  const W = frame.clientWidth, H = frame.clientHeight;
  if(pts.size===1){
    P.cx = clamp(P.cx + dx/W, -.2, 1.2);
    P.cy = clamp(P.cy - dy/H, -.2, 1.2);
  } else if(pts.size===2 && g0){
    const g = gesture();
    P.width = clamp(P.width * (g.d/g0.d), .02, 1.4);
    P.angle = clamp(P.angle + (g.a-g0.a)*180/Math.PI, -90, 90);
    g0 = g;
    $('#angle').value = Math.round(P.angle); $('#o-angle').textContent = Math.round(P.angle)+'°';
    syncScale();
  }
  showGuide(); drawGuide();
});
function gesture(){
  const a = [...pts.values()];
  const dx = a[1].x-a[0].x, dy = a[1].y-a[0].y;
  return {d:Math.max(12,Math.hypot(dx,dy)), a:Math.atan2(dy,dx)};
}
['pointerup','pointercancel'].forEach(t=>frame.addEventListener(t,e=>{ pts.delete(e.pointerId); g0 = pts.size===2?gesture():null; }));

const W_MAX = .55, W_MIN = .05, S_MIN = 12, S_MAX = 220;
function scaleFromWidth(w){
  const t = clamp((W_MAX-w)/(W_MAX-W_MIN),0,1);
  return S_MIN * Math.pow(S_MAX/S_MIN, t);
}
function widthFromT(t){ return W_MAX - t*(W_MAX-W_MIN); }
function syncScale(){
  const t = clamp((W_MAX-P.width)/(W_MAX-W_MIN),0,1);
  scaleIn.value = Math.round(t*1000);
  scaleOut.textContent = '1:'+Math.round(scaleFromWidth(P.width));
}

async function startCam(){
  stopCam();
  try{
    camStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1080} },
      audio: !!P.audio
    });
  }catch(err){
    toast('Caméra refusée ou indisponible.'); return false;
  }
  camEl.srcObject = camStream;
  await camEl.play().catch(()=>{});
  camEverStarted = true;
  $('#empty').hidden = true; frame.hidden = false;
  return true;
}
let camEverStarted = false;
function stopCam(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }

/* ======================= enregistrement ======================= */
function pickMime(){
  const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(const m of list){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return '';
}
let rec=null, chunks=[], recording=false, recStart=0, recStream=null;

function startRec(extraAudio){
  chunks = [];
  recStream = canvas.captureStream(30);
  if(extraAudio) try{ recStream.addTrack(extraAudio); }catch(e){}
  const mime = pickMime();
  const bits = canvas.width*canvas.height > 1_200_000 ? 12_000_000 : 8_000_000;
  rec = new MediaRecorder(recStream, mime?{mimeType:mime,videoBitsPerSecond:bits}:{videoBitsPerSecond:bits});
  rec.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
  rec.start(250);
  recording = true; recStart = performance.now();
  document.body.classList.add('recording');
  $('#osd').hidden = false;
}
function stopRec(){
  return new Promise(res=>{
    if(!rec){ res(null); return; }
    rec.onstop = ()=>{
      const type = rec.mimeType || 'video/webm';
      const blob = new Blob(chunks, {type: type.split(';')[0]});
      recording=false; rec=null;
      if(recStream){ recStream.getTracks().forEach(t=>{ if(t.kind==='video') t.stop(); }); recStream=null; }
      document.body.classList.remove('recording');
      $('#osd').hidden = true;
      res(blob);
    };
    rec.stop();
  });
}
function tick(){
  const s = (performance.now()-recStart)/1000;
  $('#tc').textContent = Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
}

const shutter = $('#shutter');
shutter.addEventListener('click', async ()=>{
  if(busy) return;
  if(mode==='cam'){
    if(!camStream){ await startCam(); return; }
    if(recording){
      shutter.disabled = true;
      const blob = await stopRec();
      shutter.disabled = false;
      if(blob && blob.size) showResult(blob,'video');
    } else {
      const a = camStream.getAudioTracks()[0];
      startRec(P.audio && a ? a : null);
    }
  }
  else if(mode==='vid'){ await exportVideo(); }
  else if(mode==='img'){ exportPhoto(); }
});

async function exportVideo(){
  if(!srcEl.src){ $('#pick').click(); return; }
  busy = true; document.body.classList.add('busy');
  shutter.disabled = true; sheet.classList.remove('open');
  const wasLoop = srcEl.loop;
  srcEl.loop = false; srcEl.muted = true;
  srcEl.pause(); srcEl.currentTime = 0;
  await new Promise(r=>{ const h=()=>{srcEl.removeEventListener('seeked',h);r();}; srcEl.addEventListener('seeked',h); setTimeout(r,600); });

  let audioTrack = null;
  if(P.speed===1 && srcEl.captureStream){
    try{
      srcEl.muted = false; srcEl.volume = 1;
      audioTrack = srcEl.captureStream().getAudioTracks()[0] || null;
    }catch(e){ srcEl.muted = true; }
  }
  startRec(audioTrack);
  srcEl.playbackRate = P.speed;
  $('#sub').textContent = P.speed>1 ? P.speed+'×' : '';
  const ring = $('#prog circle');
  const done = new Promise(res=>{
    const upd = ()=>{
      const p = srcEl.duration ? srcEl.currentTime/srcEl.duration : 0;
      ring.setAttribute('stroke-dashoffset', String(100-p*100));
      if(!srcEl.ended && recording) requestAnimationFrame(upd);
    };
    srcEl.addEventListener('ended', ()=>res(), {once:true});
    srcEl.play().then(upd).catch(()=>{
      srcEl.muted = true;
      srcEl.play().then(upd).catch(()=>res());
    });
  });
  await done;
  await new Promise(r=>setTimeout(r,350));
  const blob = await stopRec();
  ring.setAttribute('stroke-dashoffset','100');
  srcEl.playbackRate = 1; srcEl.loop = wasLoop; srcEl.muted = true; srcEl.play().catch(()=>{});
  busy = false; document.body.classList.remove('busy'); shutter.disabled = false;
  if(blob && blob.size) showResult(blob,'video');
  else toast("L'export a échoué. Essayez une définition plus basse.");
}

function exportPhoto(){
  if(!hasImg){ $('#pickImg').click(); return; }
  needStill = true;
  snapshotCb = ()=> canvas.toBlob(b=>{ if(b) showResult(b,'image'); }, 'image/jpeg', .95);
}

/* ======================= résultat ======================= */
let lastBlob=null, lastName='';
function showResult(blob, kind){
  lastBlob = blob;
  const ext = (blob.type.includes('mp4')?'mp4':blob.type.includes('webm')?'webm':kind==='image'?'jpg':'webm');
  const stamp = new Date().toISOString().slice(0,19).replace(/[-:]/g,'').replace('T','-');
  lastName = `tiltpak-${stamp}.${ext}`;
  const url = URL.createObjectURL(blob);
  $('#rHolder').innerHTML = kind==='image'
    ? `<img src="${url}" alt="Aperçu">`
    : `<video src="${url}" controls playsinline autoplay loop muted></video>`;
  $('#result').classList.add('open');
  const canShare = navigator.canShare && navigator.canShare({files:[new File([blob],lastName,{type:blob.type})]});
  $('#rShare').style.display = canShare ? '' : 'none';
}
$('#rClose').addEventListener('click', ()=>{
  $('#result').classList.remove('open');
  const m = $('#rHolder').querySelector('video,img');
  if(m) URL.revokeObjectURL(m.src);
  $('#rHolder').innerHTML='';
});
$('#rShare').addEventListener('click', async ()=>{
  try{ await navigator.share({files:[new File([lastBlob],lastName,{type:lastBlob.type})]}); }
  catch(e){ if(e.name!=='AbortError') toast('Partage impossible.'); }
});
$('#rSave').addEventListener('click', ()=>{
  const url = URL.createObjectURL(lastBlob);
  const a = document.createElement('a'); a.href=url; a.download=lastName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 20000);
});
